авляющие стержни из материалов, которые жадно поглощают нейтроны (например, бор или кадмий). Чем глубже стержни погружены в активную зону, тем меньше нейтронов долетает до соседних ядер и тем ниже мощность. Полностью опустить стержни — значит быстро заглушить реактор. Это один из первых рубежей защиты на любой станции.`},{id:`safety-barriers`,emoji:`🛡️`,title:`Барьеры безопасности`,text:`На случай, если что-то пойдёт не так, между радиоактивным топливом и внешним миром стоит не одна защита, а сразу несколько независимых барьеров: оболочка самих топливных таблеток, герметичный корпус реактора, и снаружи всего этого — массивная защитная оболочка (контайнмент) из бетона и стали. Чтобы авария дошла до людей, должны отказать сразу все барьеры одновременно, а системы станции спроектированы так, чтобы это было крайне маловероятно.`},{id:`belarus-energy-balance`,emoji:`🇧🇾`,title:`БелАЭС в энергобалансе страны`,text:`Белорусская АЭС в Островецком районе — первая атомная станция Беларуси. Её два энергоблока вместе способны выдавать около 2400 МВт — это заметная доля всей электроэнергии, которую потребляет страна. Работа станции позволяет Беларуси меньше сжигать привозной природный газ для выработки электричества и снижает зависимость энергосистемы от его цены и поставок.`},{id:`co2-comparison`,emoji:`🌍`,title:`АЭС и климат: а как насчёт CO₂?`,text:`Во время работы атомная станция не сжигает топливо и не выбрасывает CO₂ вообще — пар, который вы видите над градирнями, это просто водяной пар, а не дым. Если же посчитать выбросы за весь жизненный цикл (постройка, добыча урана, вывод из эксплуатации), у атомной энергетики они всё равно в десятки раз ниже, чем у угольных и газовых станций, и сопоставимы с ветряной и солнечной генерацией.`},{id:`fuel-density`,emoji:`🔋`,title:`Один твэл против вагона угля`,text:`Уран — невероятно плотный источник энергии. Одна урановая топливная таблетка размером примерно с ноготь мизинца содержит столько же энергии, сколько около тонны угля или нескольких сотен кубометров природного газа. Именно поэтому атомной станции нужно в тысячи раз меньше топлива по массе, чем тепловой станции такой же мощности.`},{id:`reactor-vs-bomb`,emoji:`❓`,title:`Реактор — это не бомба`,text:`Частый миф: реактор может взорваться как ядерная бомба. На самом деле это физически невозможно. В оружии используют уран или плутоний, обогащённые до 90%+ и собранные в специальную конструкцию для мгновенного взрывного деления. Топливо реактора обогащено всего на несколько процентов — такой концентрации категорически недостаточно для ядерного взрыва, независимо от того, что случится со станцией.`},{id:`spent-fuel`,emoji:`♻️`,title:`Куда девают отработанное топливо`,text:`Использованные топливные сборки не выбрасывают — их сначала несколько лет выдерживают в бассейнах с водой рядом с реактором, чтобы они остыли и радиоактивность снизилась, а затем помещают в герметичные контейнеры для длительного хранения. Объём такого топлива на удивление мал: всё отработанное топливо станции за десятки лет работы можно уместить на площади в пределах одного футбольного поля.`}];function BK({onBack:e}){return(0,V.jsx)(`div`,{className:`min-h-screen bg-zinc-950 text-zinc-100`,children:(0,V.jsxs)(`div`,{className:`mx-auto max-w-5xl p-4 lg:p-6`,children:[(0,V.jsxs)(`header`,{className:`mb-6 flex items-center justify-between`,children:[(0,V.jsxs)(`div`,{children:[(0,V.jsx)(`h1`,{className:`text-xl font-bold text-zinc-50`,children:`Факты об атомной энергетике`}),(0,V.jsx)(`p`,{className:`mt-1 text-sm text-zinc-500`,children:`Коротко о том, как устроена и как работает атомная станция.`})]}),(0,V.jsx)(`button`,{type:`button`,onClick:e,className:`shrink-0 rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-2 text-sm font-medium text-zinc-200 transition hover:bg-zinc-700`,children:`← Назад к пульту`})]}),(0,V.jsx)(`div`,{className:`grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3`,children:zK.map(e=>(0,V.jsxs)(`article`,{className:`flex flex-col gap-2 rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4 shadow-lg shadow-black/20 transition-all duration-200 hover:-translate-y-0.5 hover:border-zinc-700`,children:[(0,V.jsx)(`span`,{className:`text-3xl`,"aria-hidden":`true`,children:e.emoji}),(0,V.jsx)(`h2`,{className:`text-sm font-semibold text-cyan-300`,children:e.title}),(0,V.jsx)(`p`,{className:`text-sm leading-relaxed text-zinc-300`,children:e.text})]},e.id))})]})})}var VK=[{id:`goal`,emoji:`🎯`,title:`Цель`,intro:`Вы — оператор смены на атомной станции. Задача — продержать блок в безопасном режиме всю смену (5 минут или ускоренное демо на 2.5 минуты), вырабатывая энергию и вовремя реагируя на нештатные ситуации. Чем стабильнее работа и быстрее реакция — тем выше итоговое звание. Перед стартом можно выбрать сложность («Лёгкий», «Обычный», «Сложный») — она влияет на то, как рано и как часто начинаются нештатные ситуации.`},{id:`dashboard`,emoji:`🎛️`,title:`Как читать пульт`,intro:`Четыре круговых индикатора вверху показывают ключевые параметры блока прямо сейчас:`,bullets:[`Мощность — сколько энергии сейчас выдаёт реактор, % от максимума.`,`Температура — температура активной зоны; растёт с мощностью, падает при хорошем охлаждении.`,`Давление — давление в контуре, тесно связано с температурой.`,`Безопасность — обобщённая оценка состояния станции: падает, когда параметры выходят за норму, и восстанавливается, когда всё в порядке.`,`Под каждой шкалой написано, что сейчас с показателем (в норме, предупреждение, опасная зона) и какой диапазон считается нормой.`,`Цветная строка над шкалами — подсказка «что делать сейчас». Она сама меняет цвет и текст вместе с ситуацией на станции: от спокойного «всё в норме» до красного «опасная зона».`]},{id:`colors`,emoji:`🚦`,title:`Цветовая индикация`,bullets:[`Голубой — норма, всё в порядке.`,`Жёлтый — предупреждение: параметр вышел за комфортный диапазон, безопасность начинает медленно падать.`,`Красный с пульсацией — опасная зона: действовать нужно быстро, иначе авария.`]},{id:`controls`,emoji:`🕹️`,title:`Управление`,bullets:[`Слайдер и кнопки ±10% задают целевую мощность — реактор всегда движется к ней плавно, максимум на несколько процентов в секунду. Резко «выстрелить» мощностью на 100% нельзя, и это нормально: так безопаснее для охлаждения.`,`Слайдер «Город / Промышленность» распределяет выработанную энергию — старайтесь держать её близко к текущему спросу сети, чтобы не было большого дефицита или профицита.`,`Кнопка «Завершить смену» досрочно подводит итоги, если не хотите ждать до конца времени. Чтобы не нажать её случайно, она просит подтверждения: нажмите ещё раз в течение трёх секунд. Так же работает «Начать заново».`]},{id:`fuel-and-scram`,emoji:`⛽`,title:`Топливо и аварийная защита`,bullets:[`Полоска «Топливо» под управлением мощностью показывает остаток ядерного топлива — он расходуется тем быстрее, чем выше держать мощность. При критически низком запасе реактор физически не сможет выйти выше 50% мощности, пока не закончится смена.`,`Кнопка «🛑 Аварийная защита (АЗ)» — экстренный останов: мощность мгновенно падает до 0%, в отличие от обычного плавного управления. Это единственный способ мгновенно сбить мощность, но стоит штрафа очков — используйте только когда ситуация действительно вышла из-под контроля.`]},{id:`events`,emoji:`🚨`,title:`Нештатные ситуации`,intro:`Первые ~2.5 минуты смены спокойные — это время, чтобы освоиться. Дальше на пульте всплывает уведомление и появляется карточка в панели «Тревоги»: у события есть заголовок, описание и таймер обратного отсчёта.`,bullets:[`Нажмите кнопку на карточке тревоги (например, «Включить резервный насос») до истечения таймера: событие попадёт в журнал со статусом «справился».`,`Не успели — статус «не справился», и это снижает очки.`,`Пока событие активно, оно реально влияет на модель: например, отказ насоса охлаждения снижает эффективность охлаждения, и температура начинает расти, пока вы не отреагируете.`,`Одновременно активно только одно событие — не нужно бояться, что всё навалится разом.`]}
